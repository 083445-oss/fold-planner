</style></head><body><header><div class="brand">FOLD PLANNER</div><div class="nav"><button class="tab active" data-view="calendar">월간 달력</button><button class="tab" data-view="year">연간 · 월간 계획</button></div><div class="actions"><button id="cloud-login" type="button">구글 로그인</button><button id="cloud-upload" type="button" hidden>이 기기 기록 올리기</button><button id="search-open" aria-label="일정 검색" title="일정 검색">⌕ 검색</button><button id="export">백업</button><button id="import">복원</button><input type="file" id="import-file" accept=".json,application/json" hidden></div></header><main class="shell"><div class="month-head"><div class="nav"><button id="prev" aria-label="이전">‹</button><button id="today">오늘</button><button id="next" aria-label="다음">›</button></div><h1 id="period"></h1><div class="subtle" id="status"></div></div><div id="calendar-view" class="calendar-layout"><section class="panel"><div class="weeknames"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="month-grid" class="month-grid"></div><div class="legend">날짜를 누르면 오른쪽에 상세 기록이 열립니다. 색상 바는 기간 일정입니다.</div></section><section id="detail" class="panel detail"></section></div><div id="year-view" class="year-layout hide"><section class="panel year-panel"><h2 style="margin:0 0 6px">월간 계획</h2><p class="subtle">월을 누르면 달력으로 이동합니다. 각 월의 계획은 짧게 기록할 수 있습니다.</p><div id="year-grid" class="year-grid"></div></section><section class="panel year-notes"><h2 style="margin:0">연간 계획</h2><p class="subtle" id="year-label"></p><div class="section-title">올해의 목표 <button id="add-goal">+ 목표 추가</button></div><div id="year-checks" class="year-checks"></div><div class="section-title">연간 메모</div><textarea id="year-memo" class="memo" placeholder="올해의 계획과 메모를 자유롭게 작성하세요."></textarea></section></div></main><div id="modal-root"></div><div id="toast" class="toast hide"></div><script>
(()=>{'use strict';const KEY='fold-planner-v1';const now=new Date();let shown=new Date(now.getFullYear(),now.getMonth(),1),selected=dateKey(now),view='calendar',data=load(),editId=null;const colors=['#c9c9c9','#a6b8c5','#c5b5b5','#b8c6b2','#d5c8a8','#bcb4cf','#9c9c9c','#b8c8c8'];const $=s=>document.querySelector(s),el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'{}');return {events:Array.isArray(d.events)?d.events:[],memos:d.memos||{},months:d.months||{},years:d.years||{}}}catch{return {events:[],memos:{},months:{},years:{}}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='기기에 저장됨';window.foldCloud?.changed(JSON.parse(JSON.stringify(data)));return true}catch(err){$('#status').textContent='저장 실패: 브라우저 저장 권한을 확인하세요';return false}}function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function parse(k){let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(k){return `${Number(k.slice(5,7))}월 ${Number(k.slice(8))}일`};function yearObj(y){return data.years[y]||(data.years[y]={goals:[],memo:''})}function monthId(y,m){return `${y}-${String(m+1).padStart(2,'0')}`}
// Korean recurring statutory holidays. Lunar dates are derived with the browser's Chinese lunar calendar.
const lunarFmt=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric',timeZone:'Asia/Seoul'});function lunar(d){try{const p=lunarFmt.formatToParts(d);let m=p.find(x=>x.type==='month')?.value||'',day=Number(p.find(x=>x.type==='day')?.value);return {m:Number(m.replace(/[^0-9]/g,'')),day,leap:/bis|leap/i.test(m)}}catch{return {m:0,day:0,leap:false}}}function holidays(year){const map={};function add(k,name){(map[k]||(map[k]=[])).push(name)};function fixed(m,d,name){add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,name)}fixed(1,1,'신정');fixed(3,1,'삼일절');fixed(5,5,'어린이날');fixed(6,6,'현충일');fixed(8,15,'광복절');fixed(10,3,'개천절');fixed(10,9,'한글날');fixed(12,25,'성탄절');if(year>=2026)fixed(7,17,'제헌절');const lunarDates=[];for(let d=new Date(year,0,1);d.getFullYear()===year;d=addDays(d,1)){let l=lunar(d);if(!l.leap){if(l.m===1&&l.day===1)lunarDates.push({date:dateKey(d),name:'설날'});if(l.m===4&&l.day===8)add(dateKey(d),'부처님오신날');if(l.m===8&&l.day===15)lunarDates.push({date:dateKey(d),name:'추석'})}}for(let x of lunarDates){let d=parse(x.date);for(let off=-1;off<=1;off++)add(dateKey(addDays(d,off)),x.name)}// Substitute holidays: relevant statutory holidays, not temporary election/designated days.
const base=Object.entries(map).sort(([a],[b])=>a.localeCompare(b));let occupied=new Set(base.map(([k])=>k));function substitute(anchor,name){let d=addDays(parse(anchor),1);while(d.getDay()===0||d.getDay()===6||occupied.has(dateKey(d))){d=addDays(d,1)}let k=dateKey(d);add(k,name+' 대체공휴일');occupied.add(k)}for(let [k,names] of base){let dow=parse(k).getDay();for(let name of names){if(['삼일절','광복절','개천절','한글날','성탄절','부처님오신날','어린이날','제헌절'].includes(name)&&(dow===0||dow===6||names.length>1))substitute(k,name)}}for(let name of ['설날','추석']){let block=lunarDates.find(x=>x.name===name);if(!block)continue;let dates=[-1,0,1].map(n=>dateKey(addDays(parse(block.date),n)));if(dates.some(k=>[0,6].includes(parse(k).getDay()))||dates.some(k=>(map[k]||[]).some(v=>v!==name)))substitute(dates[2],name)}return map}const holidayCache={};function holidayAt(k){let y=Number(k.slice(0,4));return (holidayCache[y]||(holidayCache[y]=holidays(y)))[k]||[]}
function switchView(v){view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#calendar-view').classList.toggle('hide',v!=='calendar');$('#year-view').classList.toggle('hide',v!=='year');render()}function render(){let y=shown.getFullYear(),m=shown.getMonth();$('#period').textContent=view==='year'?`${y}년 계획`:`${y}년 ${m+1}월`;$('#prev').textContent=view==='year'?'‹ 이전 해':'‹';$('#next').textContent=view==='year'?'다음 해 ›':'›';if(view==='calendar'){renderCalendar();renderDetail()}else renderYear()}
function renderCalendar(){let grid=$('#month-grid');grid.replaceChildren();let y=shown.getFullYear(),m=shown.getMonth(),first=new Date(y,m,1),start=addDays(first,-first.getDay()),last=new Date(y,m+1,0),end=addDays(last,6-last.getDay());let count=Math.round((end-start)/86400000)+1;for(let i=0;i<count;i++){let d=addDays(start,i),k=dateKey(d),day=el('button','day');day.type='button';day.classList.toggle('other',d.getMonth()!==m);day.classList.toggle('selected',k===selected);day.classList.toggle('today',k===dateKey(now));day.classList.toggle('sunday',d.getDay()===0);let hs=holidayAt(k);day.classList.toggle('holiday',hs.length>0);day.setAttribute('aria-label',`${k} ${hs.join(', ')}`);day.append(el('span','num',String(d.getDate())));if(hs.length)day.append(el('span','holiday-name',hs.join(' · ')));let bars=el('div','bars');let ev=data.events.filter(e=>e.visible&&e.start<=k&&e.end>=k).sort((a,b)=>a.start.localeCompare(b.start)||a.title.localeCompare(b.title));for(let e of ev.slice(0,4)){let b=el('div','bar'+(e.start===k?' start':'')+(e.end===k?' end':''),e.title);b.style.background=e.color||colors[0];b.title=e.title;bars.append(b)}if(ev.length>4){let extra=el('span','subtle',`+${ev.length-4}`);bars.append(extra)}day.append(bars);day.onclick=()=>{selected=k;if(d.getMonth()!==shown.getMonth()||d.getFullYear()!==shown.getFullYear())shown=new Date(d.getFullYear(),d.getMonth(),1);render()};grid.append(day)}}function relevant(k){return data.events.filter(e=>e.start<=k&&e.end>=k).sort((a,b)=>Number(b.visible)-Number(a.visible)||a.title.localeCompare(b.title))}function renderDetail(){let root=$('#detail');root.replaceChildren();let top=el('div','detail-top'),left=el('div');left.append(el('h2','',`${fmt(selected)} · ${'일월화수목금토'[parse(selected).getDay()]}요일`));left.append(el('div','subtle',selected.slice(0,4)+'년'));top.append(left);let newBtn=el('button','primary','+ 일정 추가');newBtn.onclick=()=>openEvent();top.append(newBtn);root.append(top);let evs=relevant(selected);let app=evs.fil
